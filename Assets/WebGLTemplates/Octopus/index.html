<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Chặn cử chỉ của trình duyệt (cuộn, phóng to, giữ tay hiện kính lúp / menu chọn chữ)
         để giữ tay = rút xúc tu và vuốt = bơm đu không bị trình duyệt cướp mất. */
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120a1f;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f1e8ff;
      }

      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
        background: #120a1f;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #120a1f;
      }

      #loading-title { font-size: 22px; font-weight: 600; letter-spacing: 0.02em; }
      #loading-bar { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: #2e1f47; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #c08cff; transition: width 0.2s; }
      #loading-text { font-size: 14px; opacity: 0.7; }
      #loading-error { display: none; max-width: 520px; font-size: 14px; line-height: 1.5; color: #ffb4b4; }

      /* Game chỉ chơi màn hình ngang; trình duyệt điện thoại không khoá xoay được nên nhắc người chơi */
      #rotate-hint { display: none; z-index: 10; font-size: 18px; line-height: 1.5; }
      #rotate-icon { width: 56px; height: 56px; animation: tilt 1.6s ease-in-out infinite; }
      @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }

      #unity-warning { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; font-size: 13px; }
      #unity-warning div { padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; color: #120a1f; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="loading" class="overlay">
      <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-text">Đang tải… 0%</div>
      <div id="loading-error"></div>
    </div>

    <div id="rotate-hint" class="overlay">
      <svg id="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="7" y="2" width="10" height="20" rx="2"></rect>
        <line x1="11" y1="18" x2="13" y2="18"></line>
      </svg>
      <div>Xoay ngang điện thoại để chơi</div>
    </div>

    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var loadingFill = document.querySelector("#loading-fill");
      var loadingText = document.querySelector("#loading-text");
      var loadingError = document.querySelector("#loading-error");

      // Safari vẫn cho chụm hai ngón để phóng to dù đã đặt user-scalable=no
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); });

      // Bấm vào game thì khung game nhận phím (A/D, W, Space…)
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      function showError(message) {
        loadingText.style.display = "none";
        document.querySelector("#loading-bar").style.display = "none";
        loadingError.style.display = "block";
        loadingError.textContent = "Không mở được game: " + message;
        loading.style.display = "flex";
      }

      // Cảnh báo / lỗi của Unity: hiện dải thông báo thay cho alert() (alert chặn cả trang)
      function unityShowBanner(msg, type) {
        if (type == "error") {
          showError(msg);
          return;
        }
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.background = type == "warning" ? "#ffe08a" : "#d9c6ff";
        banner.appendChild(div);
        setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // Giữ nét trên màn hình Retina nhưng không vượt 2x, đỡ nặng trên điện thoại màn 3x
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var percent = Math.round(progress * 100);
          loadingFill.style.width = percent + "%";
          loadingText.textContent = "Đang tải… " + percent + "%";
        }).then(function () {
          loading.style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          showError(message);
        });
      };
      script.onerror = function () {
        showError("không tải được " + script.src);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
